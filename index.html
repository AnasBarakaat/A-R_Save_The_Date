<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#697344">
  <meta name="description" content="Anas & Reem — save the date, 12 December 2026.">
  <meta property="og:url"
      content="https://anasbarakaat.github.io/A-R_Save_The_Date/">
  <meta property="og:image"
      content="./preview.png">
  <title>Anas & Reem · Save the Date</title>
  <link rel="icon" href="./favicon.ico?v=2" type="image/x-icon">
  <style>
    @font-face {
      font-family: 'Jadeite Rough';
      src: url('./fonts/Jadeite-Rough.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    :root { color-scheme: dark; --green: #697344; --pearl: #f5f1e7; --fade: 650ms; }
    * { box-sizing: border-box; }
    body { margin: 0; background-color: var(--green); background-image: url('./curtain-pattern.svg'); background-repeat: repeat; background-size: 240px 640px; background-position: center top; color: var(--pearl); font-family: 'Jadeite Rough', Georgia, serif; }
    /* Fill the viewport height while preserving the original portrait proportions. */
    main { position: fixed; top: 0; left: 50%; transform: translateX(-50%); height: 100vh; height: 100dvh; width: auto; aspect-ratio: 9 / 16; overflow: hidden; }
    .film { position: absolute; inset: 0; display: flex; justify-content: center; }
    video { display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; cursor: pointer; }
    .play { position: absolute; top: 53%; border: 1px solid var(--green); border-radius: 99px; padding: 16px 24px; background: var(--green); color: var(--pearl); }
    [hidden] { display: none !important; }
    .actions { position: absolute; z-index: 2; top: 57%; left: 50%; transform: translate(-50%, -50%); width: min(320px, calc(100vw - 45px)); max-width: calc(100% - 32px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity var(--fade) ease, visibility 0s var(--fade); }
    .actions.visible { opacity: 1; visibility: visible; pointer-events: auto; transition-delay: 0s; }
    .backdrop { position: absolute; inset: 0; z-index: 1; background: rgb(0 0 0 / 20%); opacity: 0; pointer-events: none; transition: opacity var(--fade) ease; }
    .backdrop.visible { opacity: 1; }
    .description { width: 100%; margin: 0; color: var(--pearl); font-size: 14px; line-height: 1.5; text-align: center; text-wrap: balance; text-shadow: 0 2px 8px #151811cc; }
    .save { position: absolute; top: calc(100% + 24px); width: max-content; max-width: calc(100vw - 32px); display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 13px 28px; border: 2px solid var(--green); border-radius: 999px; color: var(--pearl); background: var(--green); text-decoration: none; font-size: 17px; letter-spacing: .025em; transition: background 220ms ease;  }
    .save:hover, .save:active, .save.chosen { background: var(--green); }
    :focus-visible { outline: 2px solid var(--pearl); outline-offset: 5px; }
    .alternatives { position: absolute; top: calc(100% + 86px); white-space: nowrap; margin: 0; font-size: 12px; color: var(--pearl); }
    .alternatives a { color: var(--pearl); padding: 8px 4px; display: inline-block; }
    .error { position: absolute; top: 40%; max-width: 280px; text-align: center; line-height: 1.6; background: #151811e6; padding: 20px; }
    .error a { color: var(--pearl); }
    @media (prefers-reduced-motion: reduce) { :root { --fade: 1ms; } .save { transition: none; } }
  </style>
</head>
<body>
  <main aria-label="Anas and Reem's save the date">
    <div class="film">
      <video id="video" autoplay playsinline disablepictureinpicture disableremoteplayback preload="auto" aria-label="Anas and Reem's wedding invitation, 12 December 2026">
        <source src="./save-the-date.mp4" type="video/mp4">
        Your browser does not support video playback.
      </video>
      <button class="play" id="play" type="button" hidden>Tap to play with sound</button>
      <p class="error" id="error" role="alert" hidden>The invitation could not load. <a href="./save-the-date.mp4">Open the video</a></p>
    </div>
    <div class="backdrop" id="backdrop" aria-hidden="true"></div>
    <div class="actions" id="actions" inert aria-hidden="true">
      <p class="description" id="description">Our forever begins soon</p>
      <a class="save" id="save" href="https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text=Anas+%26+Reem%27s+Wedding+%7C+Jumeirah+Gulf+of+Bahrain+%F0%9F%92%8D%F0%9F%A4%8D&amp;dates=20261212T200000%2F20261213T040000&amp;ctz=Asia%2FBahrain&amp;details=&amp;location=Jumeirah+Gulf+of+Bahrain" target="_blank" rel="noopener">Click to Save The Date</a>
      <p class="alternatives" id="alternatives">Or use <a id="apple" href="./anas-and-reem.ics" target="_blank" rel="noopener">Apple Calendar</a> · <a id="outlook" target="_blank" rel="noopener">Outlook</a></p>
    </div>
  </main>
  <noscript><p style="text-align:center">12 December 2026 · <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text=Anas+%26+Reem%27s+Wedding+%7C+Jumeirah+Gulf+of+Bahrain+%F0%9F%92%8D%F0%9F%A4%8D&amp;dates=20261212T200000%2F20261213T040000&amp;ctz=Asia%2FBahrain&amp;details=&amp;location=Jumeirah+Gulf+of+Bahrain" style="color:#f5f1e7">Click to Save The Date</a>. Enable JavaScript for automatic replay.</p></noscript>
  <script>
    const video = document.getElementById('video');
    const actions = document.getElementById('actions');
    const backdrop = document.getElementById('backdrop');
    const play = document.getElementById('play');
    const save = document.getElementById('save');
    const alternatives = document.getElementById('alternatives');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const HOLD_MS = 10000;
    const REVEAL_BEFORE_END_SECONDS = 1;
    let phase = 'playing';
    let timer;

    // All-day event: the end date is exclusive (13 December).
    const title = "Anas & Reem's Wedding | Jumeirah Gulf of Bahrain 💍🤍";
    const eventLocation = "Jumeirah Gulf of Bahrain";
    const details = `Our wedding is happening this December, and we honestly couldn't be more excited to celebrate with you!
    
We've poured so much love into creating a little world of our own, and here's your very first glimpse of it! 🎠🌟
    
One little request: We'd really appreciate an early confirmation that you'll be joining us! And if you'd love to bring a plus one, please let us know in advance so we can make sure every lovely person is accounted for!
    
With sooo much love,
Anas & Reem 🤍`;
// GOOGLE CALENDAR
save.href =
  'https://calendar.google.com/calendar/render?' +
  new URLSearchParams({
    action: 'TEMPLATE',
    text: title,
    dates: '20261212T200000/20261213T040000',
    ctz: 'Asia/Bahrain',
    details: details,
    location: eventLocation
  });
document.getElementById('outlook').href =
  'https://outlook.live.com/calendar/0/deeplink/compose?' +
  new URLSearchParams({
    path: '/calendar/action/compose',
    rru: 'addevent',
    subject: title,
    startdt: '2026-12-12T20:00:00+03:00',
    enddt: '2026-12-13T04:00:00+03:00',
    allday: 'false',
    body: details,
    location: eventLocation
  });

    function showActions(show) {
      backdrop.classList.toggle('visible', show);
      actions.classList.toggle('visible', show);
      actions.inert = !show;
      actions.setAttribute('aria-hidden', String(!show));
    }
    async function startVideo() {
      video.muted = false;
      video.volume = 1;
      try { await video.play(); play.hidden = true; }
      catch { play.hidden = false; }
    }
    function fadeAndRestart() {
      phase = 'fading';
      showActions(false);
      timer = setTimeout(() => {
        alternatives.hidden = false;
        save.classList.remove('chosen');
        video.currentTime = 0;
        phase = 'playing';
        startVideo();
      }, reducedMotion.matches ? 1 : 650);
    }
    video.addEventListener('timeupdate', () => {
      if (phase !== 'playing' || !Number.isFinite(video.duration)) return;
      showActions(video.currentTime >= Math.max(0, video.duration - REVEAL_BEFORE_END_SECONDS));
    });
    video.addEventListener('ended', () => {
      if (phase !== 'playing') return;
      phase = 'holding';
      play.hidden = true;
      showActions(true);
      clearTimeout(timer);
      timer = setTimeout(fadeAndRestart, HOLD_MS);
    });
    video.addEventListener('error', () => {
      clearTimeout(timer);
      phase = 'error';
      document.getElementById('error').hidden = false;
      play.hidden = true;
      showActions(true);
    });
    play.addEventListener('click', startVideo);
    save.addEventListener('click', () => {
      save.classList.add('chosen');
      alternatives.hidden = false;
    });
    // Recover if the browser suspended playback while a calendar app was open.
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && phase === 'playing' && video.paused && !video.ended) startVideo();
    });
    startVideo();
  </script>
</body>
</html>
